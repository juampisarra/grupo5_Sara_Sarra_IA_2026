[project]
name = "grupo5-sara-sarra-ia-2026"
version = "0.1.0"
description = "Entrega 1 de Inteligencia Artificial 2026 - planificacion del rover Ares-1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "simpleai>=0.8.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-dependency>=0.6",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["test_entrega1.py"]

[tool.ruff.format]
preview = true
